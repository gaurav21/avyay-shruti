[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avyay-shruti"
version = "0.3.0"
description = "Multilingual YouTube knowledge extractor — transcribe, extract, query"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "Avyay AI", email = "contact@avyay.ai" }]
keywords = ["youtube", "transcription", "rag", "knowledge-extraction", "multilingual", "hindi", "sanskrit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "yt-dlp>=2024.0.0",
    "groq>=0.5.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-groq>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "click>=8.0.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "mypy"]
local = ["openai-whisper", "torch"]
ocr = ["pytesseract>=0.3.10"]
speakers = ["pyannote.audio>=3.1.0", "torch>=2.0.0"]
nlp = ["spacy>=3.7.0", "transformers>=4.35.0"]
visual = ["pytesseract>=0.3.10", "numpy>=1.24.0", "Pillow>=10.0.0"]
full = [
    "pytesseract>=0.3.10",
    "pyannote.audio>=3.1.0",
    "spacy>=3.7.0",
    "transformers>=4.35.0",
    "torch>=2.0.0",
]

[project.scripts]
shruti = "shruti.cli:cli"

[project.urls]
Homepage = "https://avyay.ai/products/shruti"
Documentation = "https://docs.avyay.ai/shruti"
Repository = "https://github.com/gaurav21/avyay-shruti"

[tool.hatch.build.targets.wheel]
packages = ["shruti"]

[tool.ruff]
target-version = "py38"
line-length = 120
