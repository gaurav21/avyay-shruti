# Google Cloud Build configuration for ŚRUTI (श्रुति)
steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/avyay/shruti:$COMMIT_SHA'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/avyay/shruti:latest'
      - '.'

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/avyay/shruti'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'shruti'
      - '--image'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/avyay/shruti:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--port'
      - '8000'
      - '--set-env-vars'
      - 'CHROMA_PERSIST_DIR=/data/knowledge_base'
      - '--set-secrets'
      - 'GROQ_API_KEY=groq-api-key:latest'
      - '--allow-unauthenticated'
      - '--timeout'
      - '300'

# Images to be pushed to Artifact Registry
images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/avyay/shruti:$COMMIT_SHA'
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/avyay/shruti:latest'

# Build configuration
options:
  machineType: 'E2_HIGHCPU_8'
  substitution_option: 'ALLOW_LOOSE'
  dynamic_substitutions: true

# Timeout for the entire build
timeout: '1200s'